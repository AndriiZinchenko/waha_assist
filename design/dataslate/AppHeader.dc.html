<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(0.255 0 0)}a{color:oklch(0.98 0 0)}a:hover{color:oklch(0.84 0.15 150)}</style>
</helmet>
<div style="display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;background:oklch(0.255 0 0);border-bottom:1px solid oklch(0.44 0 0);font-family:'Fira Sans Condensed',sans-serif;color:oklch(0.98 0 0)">
  <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}">
    <span style="display:flex;align-items:center;gap:2px;height:44px;padding:0 8px 0 2px;font:600 16px 'Fira Sans Condensed',sans-serif;color:oklch(0.98 0 0)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 5 8 12 15 19"></polyline></svg>{{ backLabel }}</span>
  </sc-if>
  <sc-if value="{{ noBack }}" hint-placeholder-val="{{ false }}">
    <span style="display:flex;align-items:baseline;gap:5px;padding:0 6px 0 8px;white-space:nowrap"><span style="font:800 17px/1 'Fira Sans Extra Condensed',sans-serif;letter-spacing:0.08em">COMBAT ASSISTANT</span><span style="font:700 12px/1 'JetBrains Mono',monospace;color:oklch(0.78 0 0)">40K</span></span>
  </sc-if>
  <span style="width:36px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px">
    <span style="width:11px;height:11px;flex:none;border-radius:{{ dot.r }};background:{{ dot.bg }};border:{{ dot.bd }};clip-path:{{ dot.clip }};box-sizing:border-box"></span>
  </span>
  <sc-if value="{{ tablet }}" hint-placeholder-val="{{ false }}">
    <span style="font:500 14px 'Fira Sans Condensed',sans-serif;color:oklch(0.88 0 0);margin-left:-4px">{{ dot.label }}</span>
  </sc-if>
  <span style="flex:1;min-width:0"></span>
  <sc-if value="{{ tablet }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:8px;align-items:center;margin-right:6px">
      <div style="display:flex;height:40px;border:1px solid oklch(0.44 0 0);border-radius:4px;overflow:hidden">
        <span style="width:44px;display:flex;align-items:center;justify-content:center;font:700 14px 'Fira Sans Extra Condensed',sans-serif;letter-spacing:0.1em;background:oklch(0.98 0 0);color:oklch(0.255 0 0)">EN</span>
        <span style="width:44px;display:flex;align-items:center;justify-content:center;font:700 14px 'Fira Sans Extra Condensed',sans-serif;letter-spacing:0.1em;color:oklch(0.88 0 0)">UA</span>
      </div>
      <span style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid oklch(0.44 0 0);border-radius:4px;font:600 14px 'Fira Sans Condensed',sans-serif;color:oklch(0.88 0 0)"><span style="width:8px;height:8px;border-radius:50%;background:oklch(0.84 0.15 150)"></span>Screen awake</span>
    </div>
  </sc-if>
  <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:{{ micBg }};color:{{ micFg }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0"></path><line x1="12" y1="17" x2="12" y2="21"></line></svg></span>
  <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:{{ calcBg }};color:{{ calcFg }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"></rect><line x1="8" y1="7.5" x2="16" y2="7.5"></line><line x1="8" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="16" y2="12"></line><line x1="8" y1="16.5" x2="10" y2="16.5"></line><line x1="14" y1="16.5" x2="16" y2="16.5"></line></svg></span>
  <sc-if value="{{ phone }}" hint-placeholder-val="{{ true }}">
    <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:{{ moreBg }};color:oklch(0.98 0 0)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:52},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;],&quot;default&quot;:&quot;phone&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;backLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Armies&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sync&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;synced&quot;,&quot;pending&quot;,&quot;offline&quot;,&quot;conflict&quot;],&quot;default&quot;:&quot;synced&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;calcOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;micOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;moreOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const DOTS = {
  synced: { r: '50%', bg: 'oklch(0.84 0.15 150)', bd: 'none', clip: 'none', label: 'Synced' },
  pending: { r: '50%', bg: 'linear-gradient(90deg, oklch(0.98 0 0) 50%, transparent 50%)', bd: '2px solid oklch(0.98 0 0)', clip: 'none', label: 'Changes pending' },
  offline: { r: '50%', bg: 'transparent', bd: '2px dashed oklch(0.78 0 0)', clip: 'none', label: 'Offline — saved on this device' },
  conflict: { r: '0', bg: 'oklch(0.83 0.14 78)', bd: 'none', clip: 'polygon(50% 0,100% 100%,0 100%)', label: 'Sync conflict' }
};
class Component extends DCLogic {
  renderVals() {
    const tablet = this.props.variant === 'tablet';
    const back = this.props.back ?? true;
    const on = { bg: 'oklch(0.98 0 0)', fg: 'oklch(0.255 0 0)' }, off = { bg: 'transparent', fg: 'oklch(0.98 0 0)' };
    const c = this.props.calcOn ? on : off, m = this.props.micOn ? on : off;
    return {
      tablet, phone: !tablet, hasBack: back, noBack: !back,
      backLabel: this.props.backLabel ?? 'Armies',
      dot: DOTS[this.props.sync || 'synced'],
      calcBg: c.bg, calcFg: c.fg, micBg: m.bg, micFg: m.fg,
      moreBg: this.props.moreOn ? 'oklch(0.39 0 0)' : 'transparent'
    };
  }
}
</script>
</body>
</html>
